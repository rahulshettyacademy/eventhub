# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# TRIGGER: every push to main (plus manual runs via workflow_dispatch)
#
# - Runs ALL Playwright specs in tests/ (Chromium, per playwright.config.ts)
# - Tests target the baseURL in playwright.config.ts (live deployed site)
# - The HTML report is ALWAYS uploaded as an artifact, pass or fail
# - The job is marked failed if any test fails
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # html reporter writes playwright-report/; line reporter streams to the log
      - name: Run all Playwright tests
        run: npx playwright test --reporter=html,line
        env:
          CI: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

      # Screenshots / videos of failed tests
      - name: Upload test results (failures)
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-results-${{ github.run_number }}
          path: test-results/
          retention-days: 30
