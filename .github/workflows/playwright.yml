# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# PURPOSE:
#   Runs the full Playwright test suite on every push to main and uploads the
#   HTML report as an artifact so results can be reviewed from the Actions UI.
#
# TRIGGER: push to main (plus manual runs via workflow_dispatch)
#
# HOW:
#   Tests run inside the project's Docker image (Dockerfile: Node 22 + Playwright
#   with all browsers pre-installed), so nothing is installed on the runner.
#   The same image and command are used locally: `docker compose run --rm tests`.
#
# NOTES:
#   - Tests run against the baseURL in playwright.config.ts (live site by
#     default; override with the BASE_URL repository variable if needed)
#   - Image layers are cached in the GitHub Actions cache, so the browser
#     install only reruns when package.json / package-lock.json / Dockerfile change
#   - The HTML report is uploaded even when tests fail, and kept for 30 days
#   - The job is marked failed when any test fails
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

# Tests share one account with FIFO booking/event limits, so never run two
# suites at the same time; queue new runs instead of cancelling mid-suite.
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright:
    name: Run Playwright Tests (Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build the test image (with layer cache) ───────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged with the image name docker-compose.yml expects, so compose
      # reuses it instead of building again.
      - name: Build Playwright Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: eventhub-playwright:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Run all Playwright tests inside the container ─────────────────────
      # Report and test-results are bind-mounted back to the workspace.
      - name: Run Playwright tests
        run: docker compose run --rm tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      # ── Upload HTML report (always, so failures can be inspected) ─────────
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
