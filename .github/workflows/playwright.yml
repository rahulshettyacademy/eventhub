# ══════════════════════════════════════════════════════════════════════════════
# Playwright E2E Tests
#
# PURPOSE:
#   Runs the full Playwright test suite (inside a Docker container) against the deployed production
#   environment on every push to main. Uploads the HTML report as an artifact
#   so results can be reviewed directly in the GitHub Actions UI.
#
# TRIGGER: push to main
#
# NOTES:
#   - Tests run against https://eventhub.rahulshettyacademy.com (live site)
#   - Chromium only (as configured in playwright.config.ts)
#   - HTML report is retained for 30 days as a downloadable artifact
# ══════════════════════════════════════════════════════════════════════════════

name: Playwright E2E Tests

on:
  push:
    branches: [main]

  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: eventhub-playwright

jobs:

  # ╔═══════════════════════════════════════════════════════════════════════════
  # ║  Playwright Tests
  # ║  Builds the Docker image, runs all specs in it, and uploads the HTML report.
  # ╚═══════════════════════════════════════════════════════════════════════════
  playwright:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build the Docker image ───────────────────────────────────────────────
      # Dockerfile: Node 20 + Playwright with all browsers pre-installed.
      # Layers are cached in the GitHub Actions cache between runs.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Playwright Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Run all Playwright tests inside the container ────────────────────────
      # The report and results dirs are mounted from the runner so they survive
      # after the container exits. A failing test fails the run; the upload step
      # below uses `if: always()` so the report is still published.
      - name: Run Playwright tests in Docker
        run: |
          mkdir -p playwright-report test-results
          docker run --rm --init --ipc=host \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            ${{ env.IMAGE_NAME }}:latest \
            npx playwright test --reporter=html,line

      # ── Upload HTML report as artifact ───────────────────────────────────────
      # The report is generated in playwright-report/ by the html reporter.
      # Retained for 30 days so the team can review results after a run.
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30
